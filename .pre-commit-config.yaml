# Install or update hooks with:
#   pre-commit install
#   pre-commit autoupdate
# Run them manually on all files with:
#   pre-commit run --all-files

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-ast
      - id: check-json
      - id: check-yaml
      - id: debug-statements
        types: [python]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.2
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 2.2.4
    hooks:
      - id: pyproject-fmt

  # Keep the maintainers' private planning repository out of this public one:
  # name a task by its ID (e.g. VIS-3) instead of pointing into that repository.
  - repo: local
    hooks:
      - id: no-private-references
        name: no references to the private planning repository
        language: pygrep
        entry: 'braincell-spec|decisions-need-me|v0\.3/(milestones|records)'
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'
