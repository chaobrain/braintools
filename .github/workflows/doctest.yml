name: Doctests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  doctest:
    name: Docstring examples
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        # The testing extra brings the optional backends (h5py, pynwb, neo)
        # so the `braintools.file` examples run too.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[testing]"
      - name: Run the examples of every public module
        # One process per module bounds peak memory on hosted runners.
        run: python scripts/run_doctests.py
