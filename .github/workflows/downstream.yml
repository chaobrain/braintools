name: Downstream

# Run the test suites of packages that depend on braintools against the
# braintools in this checkout, to catch breaking changes before release.
#
# braintools deprecation warnings (BraintoolsDeprecationWarning, a
# DeprecationWarning subclass) are EXPECTED here: downstream packages still use
# names that braintools has moved and deprecated. They are reported in the
# pytest warnings summary and must not be turned into errors. Only real test
# failures fail this workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  downstream:
    name: ${{ matrix.package }} tests
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        # install: pip requirement of the downstream package; tests: what pytest
        # collects with --pyargs. braincell tracks braintools' git main and is
        # the user of braintools.visualize.morphology, so it is tested from a
        # checkout of its main (its tests need the repository's conftest,
        # benchmarks and `testing` extra), with the `morphology` extra.
        include:
          - package: brainpy
            install: brainpy
            tests: brainpy
          - package: brainmass
            install: brainmass
            tests: brainmass
          - package: brainspike
            install: brainspike
            tests: brainspike
          - package: braincell
            repository: chaobrain/braincell
            install: ./_downstream[testing]
            tests: braincell
            extras: '[morphology]'
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - name: Check out ${{ matrix.package }} main
        if: matrix.repository
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          path: _downstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install ${{ matrix.package }} and braintools from this checkout
        run: |
          python -m pip install --upgrade pip
          # Install the downstream package (this pulls braintools from PyPI
          # or git), then replace braintools with the checkout and resolve
          # its deps.
          python -m pip install "${{ matrix.install }}" pytest
          python -m pip install --force-reinstall --no-deps .
          python -m pip install ".${{ matrix.extras }}"
          python -m pip check || true
          python -c "import braintools; print('braintools', braintools.__version__, braintools.__file__)"
          python -c "import ${{ matrix.package }} as m; print(m.__name__, getattr(m, '__version__', '?'))"

      - name: Run ${{ matrix.package }} test suite
        # Run from an empty directory (or the downstream checkout, with its
        # own configuration) so braintools' pytest configuration
        # (pyproject.toml, which turns BraintoolsDeprecationWarning into an
        # error) is not picked up.
        working-directory: ${{ matrix.repository && '_downstream' || runner.temp }}
        run: |
          if [ -n "${{ matrix.repository }}" ]; then
            python -m pytest ${{ matrix.tests }} -q --maxfail=20 -p no:cacheprovider
          else
            python -m pytest --pyargs ${{ matrix.tests }} -q --maxfail=20 \
              -p no:cacheprovider -o python_files="*_test.py test_*.py"
          fi
