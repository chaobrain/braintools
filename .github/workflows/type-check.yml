name: Type Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  mypy:
    name: mypy (public API surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Keep in sync with `python_version` under [tool.mypy] in pyproject.toml.
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[type-check]"
      - name: Run mypy on the typed public surface
        # The full package is still being annotated incrementally; this gate
        # enforces type-correctness of the maintained public API. The file
        # list and options live in [tool.mypy] in pyproject.toml (`files`,
        # follow_imports=skip, ignore_missing_imports), so a bare `mypy`
        # checks exactly the configured surface.
        run: mypy
