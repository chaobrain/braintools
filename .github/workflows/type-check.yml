name: Type Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  mypy:
    name: mypy (whole package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Keep in sync with `python_version` under [tool.mypy] in pyproject.toml.
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[type-check]"
      - name: Run mypy on the whole package
        # The files and options live in [tool.mypy] in pyproject.toml
        # (`files = ["braintools"]`, tests excluded, follow_imports=skip,
        # ignore_missing_imports), so a bare `mypy` checks the whole package.
        run: mypy
